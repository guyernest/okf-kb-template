# okf-agent caps — copy to .okf/agent.toml; changes need a code-owner review (/.okf/)
#
# This file is where the maintainer-triggered agent (okf-agent) takes its limits from. The workflow
# reads it from the DEFAULT branch, validates every value to the fixed range below and refuses the
# run (a recorded refusal, `config-invalid`) when anything is out of range, mistyped or unknown. A
# missing file means every default below.
#
# schema_version      must be 1. Unknown keys and unknown tables are refused.
#
# [agent]
# model               the model the agent runs on: lowercase letters, digits, dots and hyphens, 3 to 64 characters.
# max_turns           the most turns one run may take. 1 to 100.
# timeout_minutes     the agent job's time limit. 5 to 60.
# max_budget_usd      the most one run may spend, as the CLI estimates it. 0.5 to 100. The real spending cap
#                     is the spend limit on the API key's own workspace; this is the second fence.
#
# [attachments]       what the snapshot step may fetch from the files attached to the issue. Each file is
#                     downloaded as inert data: it is hashed, never opened, and only a small text file is
#                     kept for the agent to read.
# max_files           how many attachments are fetched; the rest are listed as over-count. 0 to 20.
# max_file_bytes      the largest single attachment. 1 to 26214400 (GitHub's own limit for documents).
# max_total_bytes     the most all attachments of one issue may add up to. 1 to 52428800.
# readable_extensions the file types kept in the snapshot for the agent to read, when the file is also valid
#                     UTF-8 text. Any of .txt .md .csv .json .log .tsv .yaml .yml. Every other type is
#                     hashed and removed, and archives are never expanded.
schema_version = 1

[agent]
model = "claude-opus-5-5"
max_turns = 30
timeout_minutes = 20
max_budget_usd = 5

[attachments]
max_files = 10
max_file_bytes = 10485760
max_total_bytes = 26214400
readable_extensions = [".txt", ".md", ".csv", ".json", ".log"]
