# Phase 214 (KTPL-01, KTPL-04; D-19; T-214-29, T-214-30, T-214-31): the second REQUIRED status check of a KB
# repository. The job `okf-secret-scan` runs the gitleaks CLI over every commit of the pull request and over the net
# diff that will land, and fails on any finding without ever printing the secret it found. (PII scanning is deferred.)
#
#   - A separate required check, not a step of okf-check: its conclusion is its own, so a maintainer sees which of the
#     two gates failed, and the ruleset bootstrap lists both contexts (`okf-check`, `okf-secret-scan`).
#   - Never add a path or branch filter to this workflow: a skipped required check blocks merges for ever.
#   - The gitleaks CLI, pinned by version and by the sha256 of the release archive AND of the extracted binary in
#     `.okf/gitleaks.lock`. The gitleaks Action is NOT used: its licence is commercial for organisations (lint rule L21
#     refuses any `uses:` of it).
#   - No secret, no write token, no environment: `contents: read` on `pull_request`. Fork PRs run the same way.
#   - Trust statement. The script, the lock and the configuration are read from the PR's BASE commit
#     (`git show $OKF_BASE_SHA:<path>`), never from the pull request; only the pull request that introduces a file runs
#     its own copy, with a notice (a missing configuration falls back to the built-in rules). The commit pass scans a bare
#     mirror from an empty directory with --ignore-gitleaks-allow, so a `.gitleaksignore`, a `.gitleaks.toml` or an inline
#     `gitleaks:allow` the PR adds cannot suppress a finding (proven on the pinned binary by `just test-secret-scan-real`).
#     What this job CANNOT enforce: a `pull_request` workflow runs from the merge ref, so a PR that edits THIS file can
#     change what the required check runs. For a human PR the control is code-owner review of /.github/ (CODEOWNERS plus
#     the ruleset's "require review from Code Owners"), as for okf-check.yml.
#   - Fail closed: if the release cannot be downloaded or a digest differs, the job fails (it never skips the scan).
name: okf-secret-scan

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: okf-secret-scan-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  okf-secret-scan:
    name: okf-secret-scan
    runs-on: ${{ vars.OKF_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Scan the pull request for secrets
        env:
          OKF_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          OKF_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          fail_config() {
            printf 'okf-secret-scan: %s\n' "$1"
            exit 2
          }
          [[ $OKF_BASE_SHA =~ ^[0-9a-f]{40}$ ]] || fail_config 'the base commit id is not a full commit id'
          [[ $OKF_HEAD_SHA =~ ^[0-9a-f]{40}$ ]] || fail_config 'the head commit id is not a full commit id'
          git cat-file -e "$OKF_BASE_SHA^{commit}" 2>/dev/null || fail_config 'the base commit is not in this checkout, so the scan files cannot be read from it'
          mkdir -p "$RUNNER_TEMP/okf-verifier"
          entry="$(git ls-tree "$OKF_BASE_SHA" -- .github/okf/secret-scan.sh)"
          if [ -n "$entry" ]; then
            case "$entry" in
              '100644 blob '* | '100755 blob '*) ;;
              *) fail_config 'the base commit has secret-scan.sh but not as a regular file' ;;
            esac
            git show "$OKF_BASE_SHA:.github/okf/secret-scan.sh" >"$RUNNER_TEMP/okf-verifier/secret-scan.sh"
          else
            printf 'okf-secret-scan: this pull request introduces the scan script; it is trusted after merge (code-owner review applies)\n'
            [ -f .github/okf/secret-scan.sh ] && [ ! -L .github/okf/secret-scan.sh ] || fail_config 'the scan script is missing'
            cp .github/okf/secret-scan.sh "$RUNNER_TEMP/okf-verifier/secret-scan.sh"
          fi
          entry="$(git ls-tree "$OKF_BASE_SHA" -- .okf/gitleaks.lock)"
          if [ -n "$entry" ]; then
            case "$entry" in
              '100644 blob '* | '100755 blob '*) ;;
              *) fail_config 'the base commit has gitleaks.lock but not as a regular file' ;;
            esac
            git show "$OKF_BASE_SHA:.okf/gitleaks.lock" >"$RUNNER_TEMP/okf-verifier/gitleaks.lock"
          else
            printf 'okf-secret-scan: this pull request introduces the gitleaks pin; it is trusted after merge (code-owner review applies)\n'
            [ -f .okf/gitleaks.lock ] && [ ! -L .okf/gitleaks.lock ] || fail_config 'the gitleaks pin is missing'
            cp .okf/gitleaks.lock "$RUNNER_TEMP/okf-verifier/gitleaks.lock"
          fi
          entry="$(git ls-tree "$OKF_BASE_SHA" -- .okf/gitleaks.toml)"
          if [ -n "$entry" ]; then
            case "$entry" in
              '100644 blob '* | '100755 blob '*) ;;
              *) fail_config 'the base commit has gitleaks.toml but not as a regular file' ;;
            esac
            git show "$OKF_BASE_SHA:.okf/gitleaks.toml" >"$RUNNER_TEMP/okf-verifier/gitleaks.toml"
          else
            printf 'okf-secret-scan: the base commit has no gitleaks configuration; scanning with the built-in rules\n'
            printf '[extend]\nuseDefault = true\n' >"$RUNNER_TEMP/okf-verifier/gitleaks.toml"
          fi
          export OKF_LOCK_FILE="$RUNNER_TEMP/okf-verifier/gitleaks.lock"
          export OKF_CONFIG_FILE="$RUNNER_TEMP/okf-verifier/gitleaks.toml"
          bash "$RUNNER_TEMP/okf-verifier/secret-scan.sh" pr
