# Phase 212 (KACT-02, D-01, D-02, D-03, D-12): the trusted seed of the okf-check engine cache.
#
# This is the ONLY workflow that holds the engine read token. It downloads the pinned engine
# from the release repository named in `.okf/engine.lock`, verifies it and saves it to the
# Actions cache; the pull-request check (okf-check.yml) only restores that entry and fails
# closed on a miss. A pull request never triggers a download (D-02).
#
# Where the token lives (D-12): it is a secret of the `okf-engine-seed` ENVIRONMENT, never a
# repository secret. That environment's deployment-branch policy admits only the default
# branch, so GitHub itself refuses this job from any other ref (another branch, a pull
# request's merge ref, a fork) before the secret exists, whatever a branch's copy of this file
# says. Only this job declares the environment, and a job that does not declare it never sees
# the secret. The branch guard and the job `if` below are defence in depth, not the boundary.
# Set it up once per KB repository (see the CI runbook): create the environment, restrict its
# deployment branches to the default branch, add the secret there, and do not add a
# repository-level secret of the same name.
#
# Triggers: a push to the default branch (a pin change or any other merge), twice a week on a
# schedule (unused cache entries are evicted after 7 days, so a weekly seed would be too thin),
# and a manual dispatch. The `push` trigger has no branch filter because a template cannot name
# the default branch statically; the job `if` skips other branches, and a skipped job never
# evaluates the environment.
#
# Seeding a pin-bump PR before merging it (research Pitfall 1): the PR's own check stays red
# until its pin is seeded, and a PR never downloads (D-02). Dispatch this workflow on the default
# branch with `lock-ref` set to the PR branch name, or to `pull/<N>/head` for a fork's PR. The
# job reads that ref's `.okf/engine.lock` as data only (one file, a sparse checkout, never
# executed), seeds it only if its `release_repo` equals the default branch's, and the PR check
# then restores it. A candidate that changes `release_repo` is refused: land that change on the
# default branch first.
#
# Cache-miss recovery: if the PR check says the engine is not seeded, run this workflow on the
# default branch (Actions tab -> okf-seed-engine -> Run workflow).
#
# A successful seed run triggers okf-bundle-view (the bundle view page).
#
# The release repository comes only from the lock through the action, never from this
# repository's own owner (KACT-04).
name: okf-seed-engine

on:
  push:
  schedule:
    - cron: '17 4 * * 1,4'
  workflow_dispatch:
    inputs:
      lock-ref:
        description: 'Seed the engine pinned by this ref instead of the default branch (a branch name, or pull/<N>/head); empty seeds the default pin'
        required: false
        default: ''
        type: string

permissions:
  contents: read

concurrency:
  group: okf-seed-engine
  cancel-in-progress: false

jobs:
  okf-seed-engine:
    # Opt-in (Phase 214, D-12): the job runs only where bootstrap set OKF_MAINTENANCE_ENABLED, so it never runs, and never
    # fails on a missing token, in the public template repository itself or in a repository nobody has bootstrapped. A
    # repository set up by hand from the runbook sets the variable once. A push to any other branch skips the job, so
    # nothing runs and no environment is evaluated.
    if: vars.OKF_MAINTENANCE_ENABLED == 'true' && (github.event_name != 'push' || github.ref == format('refs/heads/{0}', github.event.repository.default_branch))
    environment: okf-engine-seed
    runs-on: ${{ vars.OKF_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 15
    steps:
      - name: Guard - the seed runs only on the default branch
        env:
          OKF_EVENT: ${{ github.event_name }}
          OKF_REF: ${{ github.ref }}
          OKF_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          # GitHub runs scheduled workflows only on the default branch, and a schedule event
          # carries no repository payload to compare against.
          if [ "$OKF_EVENT" = "schedule" ]; then
            exit 0
          fi
          if [ -z "$OKF_DEFAULT_BRANCH" ] || [ "$OKF_REF" != "refs/heads/$OKF_DEFAULT_BRANCH" ]; then
            printf '::error::the Seed workflow runs only on the default branch (%s)\n' "${OKF_DEFAULT_BRANCH:-unknown}"
            exit 1
          fi

      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate the candidate ref
        if: github.event_name == 'workflow_dispatch' && inputs.lock-ref != ''
        id: candidate
        env:
          OKF_LOCK_REF: ${{ inputs.lock-ref }}
        run: bash .github/okf/candidate-lock.sh ref "$OKF_LOCK_REF" --github-output

      # Only the lock file is materialised, and nothing from it is executed.
      - name: Fetch the candidate lock as data
        if: github.event_name == 'workflow_dispatch' && inputs.lock-ref != ''
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.candidate.outputs.ref }}
          path: .okf-candidate
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout: .okf/engine.lock
          sparse-checkout-cone-mode: false

      - name: Compare the candidate with the default pin
        if: github.event_name == 'workflow_dispatch' && inputs.lock-ref != ''
        id: pin
        run: bash .github/okf/candidate-lock.sh compare .okf/engine.lock .okf-candidate/.okf/engine.lock --github-output

      - name: Seed the pinned engine
        id: engine
        uses: ./.github/actions/okf-engine
        with:
          mode: seed
          lock-file: ${{ steps.pin.outputs.lock-file || '.okf/engine.lock' }}
          token: ${{ secrets.ENGINE_RELEASE_TOKEN }}

      - name: Summarise the seed
        env:
          OKF_VERSION: ${{ steps.engine.outputs.version }}
          OKF_KEY: ${{ steps.engine.outputs.key }}
          OKF_ARCH: ${{ runner.arch }}
        run: |
          printf 'Seeded okf-check %s for %s (cache key %s)\n' "$OKF_VERSION" "$OKF_ARCH" "$OKF_KEY" >>"$GITHUB_STEP_SUMMARY"
